# =============================================================================
# ===                              ~/.tmux.conf                             ===
# =============================================================================
# This configuration file adds new features without changing existing keys.


# =============================================================================
# ===         USER'S ORIGINAL CONFIG (PRESERVED UNCHANGED)                  ===
# =============================================================================

set-option -g history-limit 10000
set -s escape-time 0
set -g default-terminal "screen-256color"
set -g mouse on
unbind ^Z
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY FT_APP VIRTUAL_ENV PATH PS1"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
unbind-key PPage
bind-key -T root S-PPage if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"
bind-key -T copy-mode WheelUpPane send -X halfpage-up
bind-key -T copy-mode WheelDownPane send -X halfpage-down
bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
set-window-option -g pane-active-border-style '' # Respecting user's choice for no active border color
bind -n C-k clear-history


# =============================================================================
# ===         ADDITIONS & ENHANCEMENTS (NO OVERRIDES)                     ===
# =============================================================================


# -- GENERAL QOL ADDITIONS ----------------------------------------------------

# Add true color support alongside 256 colors
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on


# -- NEW KEYBINDINGS (USING UNBOUND KEYS) -------------------------------------

# Reload config file with Prefix + r (r is unbound by default)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Add intuitive pane splitting, keeping original % and "
# | splits vertically, - splits horizontally
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Add prefix-less pane navigation with Alt + Arrow Keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Add repeatable pane resizing with vim keys (H, J, K, L are unbound)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Add pane management keybinds
bind b break-pane  # 'b' is unbound, "break" pane out to a new window
bind j command-prompt -p "join pane from:" "join-pane -s '%%'" # 'j' for "join"


# -- UI & THEME (CUSTOM STATUS BAR) -------------------------------------------
# These settings customize the status bar without affecting your pane borders.

set -g status-position bottom                   # Move status bar to the top
set -g status-justify left                    # Align window list to the left
set -g status-style 'bg=colour235 fg=colour252' # Dark gray background, light text
set -g status-interval 1                      # Refresh status bar every second

# Inactive window style in the window list
setw -g window-status-style 'fg=colour109'
# Active window style in the window list
setw -g window-status-current-style 'fg=colour15 bg=colour31' # White text on a blue background

# Show session name, window list, and pane title
set -g status-left '#[fg=colour232,bg=colour15] #S #[bg=colour235,fg=colour252] '
set -g status-right '#[fg=colour252,bg=colour235] %H:%M %d-%b-%y '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-separator ''

# Message/command line style
set -g message-style 'bg=colour31 fg=colour15'


# -- COPY MODE ENHANCEMENTS (KEYBOARD-BASED) ----------------------------------
# These complement your existing mouse-based copy bindings.

# Enable vi-style keys for copy mode
set-window-option -g mode-keys vi

# Add keyboard copy bindings for vi-mode (v to select, y to yank)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Add a binding to aank the entire pane content to the clipboard (Y is unbound)
bind Y run "tmux save-buffer - | xclip -i -sel clipboard"


# -- PLUGINS (TPM) FOR ADDED FUNCTIONALITY ------------------------------------
# To install, start tmux and press C-b + I (capital i)

set -g @plugin 'tmux-plugins/tpm'                   # Plugin manager itself
set -g @plugin 'tmux-plugins/tmux-resurrect'        # Persist tmux environment across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'        # Auto-save for resurrect

# --- Plugin Configuration ---
# Automatically restore last session on tmux start
set -g @continuum-restore 'on'
# Keybindings for Resurrect (prefix + Ctrl-s to save, prefix + Ctrl-r to restore)


# Initialize TPM (keep this at the very end of your tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
